name: Release

on:
  push:
    tags:
      - "v*"
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

jobs:
  publish:
    name: 📦 Publish to PyPI (OIDC)
    environment: release
    runs-on: ubuntu-26.04
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Sync version dynamically from git tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Setting dynamic release version to: $VERSION"
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" pyproject.toml
          sed -i "s/^__version__ = \".*\"/__version__ = \"$VERSION\"/" smallpict/__init__.py 2>/dev/null || true
      - name: Install build tools
        run: pip install hatch
      - name: Build wheel and source dist
        run: hatch build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
